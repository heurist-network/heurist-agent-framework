services:
  mesh-api:
    image: heuristdotai/mesh:${COMMIT_SHA:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    # Host network so mesh reaches tew-postgres on 127.0.0.1:5432. Listen on
    # 8800 so nginx (sites-available/mesh → 127.0.0.1:8800) keeps working;
    # host :8000 is already taken by ask-heurist-api.
    command: ["uvicorn", "mesh.mesh_api:app", "--host", "0.0.0.0", "--port", "8800"]
    # swarm-compatible host networking (docker stack deploy ignores network_mode)
    networks:
      - hostnet
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INFLOW_CONTEXT_DB_PATH=/data/mesh/inflow_contexts.db
    volumes:
      - /data/mesh:/data/mesh
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8800/mesh_health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s

networks:
  hostnet:
    external: true
    name: host
